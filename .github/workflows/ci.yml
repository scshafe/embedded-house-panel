name: CI

# BASE-04. Added by scshafe-dev (the native kind). It runs
# dev.toml [verify] command (BASE-06): keep the two equal.
#
# No language, build system or platform is assumed. ubuntu-latest has common
# toolchains preinstalled (a C/C++ compiler, cmake, Python, Node, Go, Rust);
# add the setup your [verify] command needs before it (packages, an SDK, a
# toolchain action pinned by SHA). To build on other platforms, use a matrix
# of GitHub-hosted runners (macos-latest, windows-latest); dev check lists
# them (NATIVE-01). A release or store upload is a workflow of its own.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # The host toolchain make verify needs, matching the Arch bootstrap list
      # (scripts/environment/bootstrap_arch_build_host.sh). Go is preinstalled.
      - name: Install verify dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ripgrep shellcheck ninja-build pkg-config device-tree-compiler \
            libcurl4-openssl-dev libssl-dev libpng-dev libdrm-dev libsdl2-dev libasound2-dev \
            nlohmann-json3-dev
      # actions/setup-python v7.0.0: CPython 3.12 for the enclosure's CAD venv,
      # whose build123d closure enclosure/requirements.txt hash-locks.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install the enclosure CAD environment
        run: |
          make enclosure-venv ENCLOSURE_PYTHON="$pythonLocation/bin/python3"
      - name: Verify (dev.toml [verify] command)
        run: |
          make verify
      - name: Build the mirror unit's printable parts
        run: |
          make enclosure
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mirror-unit-print
          path: .build/enclosure/out/
          if-no-files-found: error
