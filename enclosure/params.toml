# The mirror unit's layout: every part, the shell and every cable.
#
# Read by enclosure/fit_check.py (the fit check, drawings and tables) and by
# the solid model. Frame: the origin is the centre of the panel glass's front
# face; x runs to the right of the person at the mirror, y up, and z toward
# that person, so everything behind the glass has z < 0. Lengths are mm.
#
# Each part has a pose (quarter turns, then a translation) and lists its
# shapes, holes, connectors and points in its own frame. Every item carries a
# status (measured, vendor, estimate, placeholder, design) and a source; a
# part's provenance table is the default for its items. Nothing here is
# measured yet (owner, 2026-10-20: design from vendor data, flagged, then
# calipers). docs/hardware/mirror-unit-layout.md lists what to measure.

schema_version = 1

[printer]
# Owner, 2026-10-20.
bed = [256.0, 256.0]
margin = 5.0
material = "PETG"

[clearance]
# Design choices: the minimum gap between solids of different parts, the
# plastic-only distance around the Wi-Fi antenna, and the microphone ports'
# distance from the speaker.
part = 1.0
cable = 0.5
rf_metal = 10.0
mic_to_speaker = 80.0

[acoustic]
mic_part = "mic_strip"
speaker_shape = "speaker.body"

[allow]
# The gate board's USB-A plug sits inside the board's USB-A receptacle.
contact = [["gate.usb_plug", "frdm.j4_usba"], ["gate.usb_plug", "frdm.low_parts"]]

[shell]
# Interior: x within the glass plus 0.5 mm, y from the gate board's switch
# to above the power cable's loop, z from the rear plate to the glass front.
outer_low = [-99.38, -140.0, -47.0]
outer_high = [99.38, 76.4, 3.0]
wall = 2.4
rear = 3.0
front = 3.0
gasket = 1.0
lip_overlap = 2.5

[[shell.openings]]
id = "mic0"
face = "+z"
purpose = "acoustic port, MIC3 (strip x +49.5)"
min = [-48.5, 60.22, 0.0]
size = [2.0, 2.0, 3.5]

[[shell.openings]]
id = "mic1"
face = "+z"
purpose = "acoustic port, MIC2"
