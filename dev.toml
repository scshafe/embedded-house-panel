# Project intent (BASE-01). The schema is illustrative until M2/M7 fix it.
schema_version = 1

[project]
id = "embedded-house-panel"
class = "managed"

# A native, desktop or game application: no language, build system or
# package manager is assumed; [verify] is how this one is built and tested.
[app]
kind = "native"

# BASE-06: the one command that verifies this repository, run from its root
# by .github/workflows/ci.yml and by hand on the checkout under review. Keep
# the two equal.
[verify]
command = "make verify"

# HW-01 (scshafe-dev 0.9.0): the board this project is developed against
# (references, never secrets). `make verify` above is the host gate; the
# hardware gate below runs only from a session on the board's console or LAN
# (export config/device.env first). The facts are docs/operations/frdm-bringup.md's.
[hardware]
board = "frdm-imx8mp"
soc = "NXP i.MX 8M Plus; FRDM-IMX8MPLUS, 4 GB LPDDR4, 32 GB eMMC"
console = "/dev/serial/by-id/usb-1a86_USB_Dual_Serial_535A000001-if00"
baud = 115200
ssh = "root@192.168.7.181"
access = "owner"
verify = "make verify-board"
owner_gated = [
  "flash anything (uuu, dd to the eMMC, a microSD card or the QSPI flash)",
  "write the board's storage outside /tmp, or change its boot switch or U-Boot environment",
  "install or remove packages on the board",
  "suspend, reboot or power-cycle the board",
  "enroll it in the tailnet or change Wi-Fi, tailnet or admin settings",
  "accept the NXP firmware license (NXP-FIRMWARE-EULA)",
]
evidence = "hardware_tests/results"
prerequisites = [
  "an aarch64 cross compiler (the aarch64 cross build)",
  "KERNEL_DIR, an NXP lf-6.12.49-2.2.0 kernel tree (the presence kernel module)",
  "BHP_BUILDROOT_DIR, the hash-verified Buildroot archive (the defconfig evaluation)",
]
notes = "Power it from the PC's USB-C (the Apple PD charger reset-loops U-Boot); the LAN address is a DHCP lease, not reserved."

[skills]
# BASE-05 asks for .agents/skills; the catalog is M4. Recorded gap.
selected = []

# Adopted, not generated (D-6): `dev adopt --add-missing` added this file to
# an existing native project on 2026-10-04. It records which scshafe-dev
# standard the repository was adopted under; it does not claim scshafe-dev
# rendered this repository's files, and the ones that existed were left as
# they are.
[template]
source = "scshafe/scshafe-dev"
version = "0.9.0"
commit = "f0c75e91f4dc1b80ceb15c1ee0dbcabbb0649c00"
released = true
dirty = false
mode = "adopted"
params = { kind = "native", name = "embedded-house-panel", date = "2026-10-04" }

[identity]
agent = "agent-embedded-house-panel"
github = ["contents=write", "pull_requests=write", "issues=write", "workflows=write", "actions=write"]
