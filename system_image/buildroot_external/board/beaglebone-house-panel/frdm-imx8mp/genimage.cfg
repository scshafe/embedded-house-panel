# @canonical buildroot_frdm_imx8mp_image_layout -- FRDM i.MX 8M Plus SD/eMMC image.
# imx8-boot-sd.bin (SPL + LPDDR4 training firmware + ATF + U-Boot FIT) sits at
# the i.MX 8M Plus boot offset of 32 KiB outside the partition table. The FAT
# boot partition carries the kernel, the merged project DTB, and extlinux.conf
# for U-Boot standard boot. The fixed disk signature makes root=PARTUUID stable
# on both microSD (mmcblk1) and eMMC (mmcblk2); never boot with both media
# carrying this image.
image boot.vfat {
	vfat {
		label = "boot"
		files = {
			"Image",
			"imx8mp-frdm-bhp-panel.dtb"
		}
		file extlinux/extlinux.conf {
			image = "extlinux.conf"
		}
	}

	size = 64M
}

image sdcard.img {
	hdimage {
		disk-signature = 0xb4f5a8e1
	}

	partition imx-boot {
		in-partition-table = "no"
		image = "imx8-boot-sd.bin"
		offset = 32K
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
		offset = 8M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 512M
	}
}
